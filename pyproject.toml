[project]
name = "conclave"
version = "0.1.0"
description = "Calibrated multi-agent ACMG variant interpretation with per-criterion conformal abstention."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [
    {name = "Joel Njoku", email = "njokujoel98@gmail.com"},
]

dependencies = [
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "hypothesis==6.152.4",
    "ruff==0.15.12",
    "mypy==1.20.2",
    "pre-commit==4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conclave"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "B",    # bugbear (common bugs)
    "UP",   # pyupgrade (modern syntax)
    "N",    # PEP-8 naming
    "ANN",  # type annotation enforcement
    "S",    # security (bandit)
    "PT",   # pytest style
    "SIM",  # simplifications
    "RUF",  # ruff-native rules
]
# Ruff 0.15 removed ANN101 and ANN102 — Python no longer flags missing
# self/cls annotations. No active ignores currently needed.
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # tests are allowed to use assert

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",                  # show summary of all non-passing tests
    "--cov=conclave",
    "--cov-branch",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "determinism: marks tests as determinism tests",
]
